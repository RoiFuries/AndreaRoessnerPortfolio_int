<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andrea Roessner — Links</title>
<meta name="description" content="Todos los links de Andrea Roessner, production designer.">
<style>
/* Self-contained page: fonts/tokens/aurora text/lang-switch trimmed from
   css/style.css, plus the .links-* rules — kept out of the shared
   stylesheet on purpose so this file has zero external dependencies. */
@font-face { font-family: 'Grift'; src: url('assets/fonts/Grift-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Grift'; src: url('assets/fonts/Grift-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Grift'; src: url('assets/fonts/Grift-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Grift'; src: url('assets/fonts/Grift-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Grift'; src: url('assets/fonts/Grift-Black.ttf') format('truetype'); font-weight: 900; font-display: swap; }

:root {
  --ink: #17140E;
  --ink-soft: #6B6558;
  --paper: #FFFFFF;
  --cream: #F5F3EE;
  --border: rgba(23, 20, 14, 0.15);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Grift', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}
a { color: var(--ink); text-decoration: none; }

@keyframes auroraMove {
  0% { background-position: 0% 50%, 100% 0%, 0% 100%, 100% 100%; }
  50% { background-position: 100% 50%, 0% 100%, 100% 0%, 0% 0%; }
  100% { background-position: 0% 50%, 100% 0%, 0% 100%, 100% 100%; }
}
.aurora-text {
  background-image:
    radial-gradient(circle at 20% 30%, var(--a1) 0%, transparent 45%),
    radial-gradient(circle at 80% 20%, var(--a2) 0%, transparent 45%),
    radial-gradient(circle at 20% 80%, var(--a3) 0%, transparent 45%),
    radial-gradient(circle at 80% 80%, var(--a4) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, var(--a5) 0%, transparent 50%);
  background-size: 220% 220%;
  background-color: var(--ink);
  background-blend-mode: multiply;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: auroraMove 14s ease-in-out infinite;
}
.aurora-commercials { --a1:#00C2CB; --a2:#FFE38A; --a3:#7FE0D4; --a4:#FF5D8F; --a5:#FF9A76; }

.lang-switch { display: flex; gap: 8px; font-size: 12px; letter-spacing: 0.05em; }
.lang-switch button {
  appearance: none;
  background: none;
  border: none;
  font-family: 'Grift', sans-serif;
  color: inherit;
  opacity: 0.5;
  cursor: pointer;
  padding: 2px 3px;
  transition: opacity 0.25s ease;
}
.lang-switch button:hover { opacity: 0.9; }
.lang-switch button[aria-current="true"] { opacity: 1; border-bottom: 1px solid currentColor; }

.links-page {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 24px 48px;
}
.links-topbar { width: 100%; max-width: 420px; display: flex; justify-content: center; margin-bottom: 48px; }

.links-hero { width: 100%; max-width: 420px; text-align: center; margin-bottom: 40px; }
.links-hero__name-line {
  font-weight: 700;
  font-size: clamp(40px, 13vw, 76px);
  line-height: 0.95;
  letter-spacing: -0.02em;
}
.links-hero__role {
  font-size: 12px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 10px;
}

.links-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
.links-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 22px;
  border: 1px solid var(--border);
  border-radius: 100px;
  transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
}
.links-item:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.links-item__icon { flex: 0 0 auto; display: flex; }
.links-item__text { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.links-item__label { font-weight: 600; font-size: 15px; }
.links-item__meta {
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  transition: color 0.25s ease;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.links-item:hover .links-item__meta { color: rgba(245, 243, 238, 0.7); }

.links-footer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 24px 20px;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  text-align: center;
}
.links-footer__credit { transition: color 0.25s ease; }
.links-footer__credit:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="links-page">
  <div class="links-topbar">
    <span class="lang-switch">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="de">DE</button>
    </span>
  </div>

  <section class="links-hero">
    <div class="links-hero__name-line aurora-text aurora-commercials">ANDREA</div>
    <div class="links-hero__name-line aurora-text aurora-commercials">ROESSNER</div>
    <div class="links-hero__role" data-i18n="role"></div>
  </section>

  <nav class="links-list" aria-label="Links">
    <a class="links-item" href="https://andrearoessner.com" target="_blank" rel="noopener">
      <span class="links-item__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a16 16 0 0 1 0 18M12 3a16 16 0 0 0 0 18"></path></svg>
      </span>
      <span class="links-item__text">
        <span class="links-item__label" data-i18n="website"></span>
        <span class="links-item__meta">andrearoessner.com</span>
      </span>
    </a>

    <a class="links-item" href="https://www.instagram.com/andrea.roessner/" target="_blank" rel="noopener">
      <span class="links-item__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>
      </span>
      <span class="links-item__text">
        <span class="links-item__label" data-i18n="instagram"></span>
        <span class="links-item__meta">@andrea.roessner</span>
      </span>
    </a>

    <a class="links-item" href="https://www.instagram.com/objeteria_nacional" target="_blank" rel="noopener">
      <span class="links-item__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>
      </span>
      <span class="links-item__text">
        <span class="links-item__label" data-i18n="instagramObjeteria"></span>
        <span class="links-item__meta">@objeteria_nacional</span>
      </span>
    </a>

    <a class="links-item" href="https://vimeo.com/andrearoessner" target="_blank" rel="noopener">
      <span class="links-item__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22.4 6.4c-.1 2.1-1.6 5-4.4 8.6-2.9 3.8-5.3 5.6-7.4 5.6-1.3 0-2.4-1.2-3.3-3.6L5.9 12c-.6-2.3-1.2-3.4-1.9-3.4-.1 0-.6.3-1.6 1L1.6 8.2c1-.9 2.1-1.9 3.1-2.8 1.4-1.2 2.4-1.9 3.1-1.9 1.6-.2 2.6 1 3 3.4.5 2.7.8 4.3 1 5 .5 2.4 1.1 3.6 1.8 3.6.5 0 1.3-.8 2.3-2.5 1-1.6 1.6-2.9 1.6-3.7.1-1.4-.5-2.1-1.8-2.1-.6 0-1.3.1-2 .4 1.3-4.4 3.9-6.5 7.6-6.4 2.1.1 3.2 1.5 3.1 4.2z"></path></svg>
      </span>
      <span class="links-item__text">
        <span class="links-item__label" data-i18n="vimeo"></span>
        <span class="links-item__meta">vimeo.com/andrearoessner</span>
      </span>
    </a>

    <a class="links-item" href="mailto:hello@andrearoessner.com">
      <span class="links-item__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect><path d="M3 6.5l9 6.5 9-6.5"></path></svg>
      </span>
      <span class="links-item__text">
        <span class="links-item__label" data-i18n="email"></span>
        <span class="links-item__meta">hello@andrearoessner.com</span>
      </span>
    </a>
  </nav>
</div>

<footer class="links-footer">
  <a href="https://www.rmqz.mx/" target="_blank" rel="noopener" class="links-footer__credit" data-i18n="credit"></a>
  <span data-i18n="copyright"></span>
</footer>

<script>
(function () {
  var DICT = {
    es: {
      role: 'PRODUCTION DESIGNER',
      website: 'Website | Portafolio',
      instagram: 'Instagram',
      instagramObjeteria: 'Objetería Nacional',
      vimeo: 'Vimeo',
      email: 'Correo',
      credit: 'With love by Roi Furies',
      copyright: '© 2026 Andrea Roessner All rights reserved'
    },
    en: {
      role: 'PRODUCTION DESIGNER',
      website: 'Website | Portafolio',
      instagram: 'Instagram',
      instagramObjeteria: 'Objetería Nacional',
      vimeo: 'Vimeo',
      email: 'Email',
      credit: 'With love by Roi Furies',
      copyright: '© 2026 Andrea Roessner All rights reserved'
    },
    de: {
      role: 'PRODUCTION DESIGNER',
      website: 'Website | Portafolio',
      instagram: 'Instagram',
      instagramObjeteria: 'Objetería Nacional',
      vimeo: 'Vimeo',
      email: 'E-Mail',
      credit: 'With love by Roi Furies',
      copyright: '© 2026 Andrea Roessner All rights reserved'
    }
  };

  var SUPPORTED = Object.keys(DICT);
  var STORAGE_KEY = 'ar_lang';

  function detectDefault() {
    try {
      var stored = localStorage.getItem(STORAGE_KEY);
      if (stored && SUPPORTED.indexOf(stored) !== -1) return stored;
    } catch (e) {}
    var nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
    return SUPPORTED.indexOf(nav) !== -1 ? nav : 'es';
  }

  var currentLang = detectDefault();

  function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      el.textContent = DICT[currentLang][key] || DICT.es[key] || key;
    });
    document.documentElement.setAttribute('lang', currentLang);
    document.querySelectorAll('.lang-switch button').forEach(function (btn) {
      btn.setAttribute('aria-current', String(btn.getAttribute('data-lang') === currentLang));
    });
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.lang-switch button');
    if (!btn) return;
    var lang = btn.getAttribute('data-lang');
    if (SUPPORTED.indexOf(lang) === -1) return;
    currentLang = lang;
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (e2) {}
    applyTranslations();
  });

  document.addEventListener('DOMContentLoaded', applyTranslations);
})();
</script>
</body>
</html>
